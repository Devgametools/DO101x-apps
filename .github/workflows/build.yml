name: Build en OpenShift
on:
  push:
    branches: [update-app]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest
      - name: Login y build
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}
          oc start-build version -n vbravot-dev
